name: CI

on:
  pull_request: {}
  push:
    branches: [main]
    # A tag is what actually ships; the e2e-docker job runs on tags (see its
    # `if` gate) so a release is proven restorable before it goes out.
    tags: ["v*"]
  workflow_dispatch: {}

# One in-flight run per ref. PR pushes cancel their predecessor — nobody reads
# the result of a superseded commit — while main and tags run to completion so
# their history stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deliberately NO `paths:` filter. These jobs are required status checks, and a
# path-filtered required check never reports on a PR it excluded — the PR is then
# unmergeable forever with no visible reason.

jobs:
  # FE1-S1 (#19): frozen topology guard (docs/issues/issue-013-package-topology-contract.md §2)
  # plus the no-clean-engine-imports canonical-recalculation ban
  # (docs/issues/issue-011-client-authority-boundary-contract.md §4).
  # Two layers, both fail closed:
  #   1. check-dependency-boundaries.mjs — zero-dep lexical scan, runs before install
  #   2. eslint boundary rules (no-restricted-imports edge set + local
  #      boundary/no-clean-engine-imports rule; --no-inline-config) — AST-exact
  boundaries:
    name: Dependency boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check workspace dependency boundaries (pre-install)
        run: node scripts/check-dependency-boundaries.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint boundary rules (AST-exact)
        run: bun run lint:boundaries

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck apps/api
        run: bun run --cwd apps/api lint

      - name: Typecheck apps/dashboard
        working-directory: apps/dashboard
        run: |
          set -o pipefail
          # fumadocs has pre-existing type errors that are filtered out;
          # any other error causes the step to fail via the exit code below.
          npx tsc --noEmit 2>&1 | tee tsc.log | grep -v fumadocs || true
          if grep -v fumadocs tsc.log | grep -E '^(.*): error TS' > /dev/null; then
            echo "Typecheck failed (non-fumadocs errors above)"
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs `turbo run test` → vitest across every package that defines a test
      # script (@repo/core, @repo/adapters, @repo/db [PGlite — no external DB],
      # apps/api, apps/dashboard). Packages resolve to src, so no build needed.
      # apps/api excludes test/e2e/** here — those need a daemon and run in the
      # e2e-docker job below.
      - name: Run tests
        run: bun run test

  # FE1-S6 (#24): the frozen generated contract must match its snapshot. Any
  # hand-edit of packages/contracts/src/generated/wire.ts or a stale snapshot
  # fails here — regenerate via `bun run --cwd packages/contracts generate`.
  # Runbook: docs/ci/quality-gates.md §Contracts drift.
  contracts-drift:
    name: Contracts drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated contracts against their snapshot
        run: bun run --cwd packages/contracts verify

  # FE1-S6 (#24): high-confidence secret detection over every git-tracked file.
  # Pre-install by design — the gate must run even when the dependency install
  # is broken. Allowances require an inline `secret-scan:allow(<reason>)`
  # marker; unexplained secrets-shaped literals fail the build.
  # Runbook: docs/ci/quality-gates.md §Secret scan.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan tracked files for credential shapes
        run: node scripts/check-secrets.mjs

  # FE1-S6 (#24): known-vulnerability audit (OSV) and license allowlist over
  # every installed package, including the per-workspace trees that bun does
  # not hoist. Vulnerabilities are remediated by a lockfile bump, or ignored
  # with a reviewed entry in scripts/check-dependency-vulnerabilities.mjs.
  # Runbook: docs/ci/quality-gates.md §Dependency audit / §License scan.
  dependencies:
    name: Dependency audit & licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit installed packages against OSV
        run: node scripts/check-dependency-vulnerabilities.mjs

      - name: Enforce the license allowlist
        run: node scripts/check-licenses.mjs

  # FE1-S6 (#24): the production-critical bundles must stay inside their frozen
  # byte budgets (scripts/analyze-bundles.mjs). Raising a budget is a
  # PR-visible change that has to name the feature that grew the output.
  # Runbook: docs/ci/quality-gates.md §Bundle analysis.
  bundle-analysis:
    name: Bundle analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build api, dashboard and client
        run: |
          bun run build
          bun run --cwd packages/client build

      - name: Enforce bundle budgets
        run: |
          node scripts/analyze-bundles.mjs apps/api/dist apps/dashboard/.next packages/client/dist

      - name: Scan the web-client bundle for fixture/mock references
        run: |
          node scripts/check-production-bundle.mjs apps/dashboard/.next packages/client/dist

  # FE1-S6 (#24): every shipped surface must build in CI — web (Next),
  # desktop (Electron packaging smoke; signing/notarization is FE4-D1) and
  # cli. Buildable legs additionally re-run their bundle budget.
  # Runbook: docs/ci/quality-gates.md §Build matrix.
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [web, desktop, cli]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web (Next.js production bundle)
        if: ${{ matrix.target == 'web' }}
        run: |
          bun run --cwd apps/web build
          node scripts/analyze-bundles.mjs apps/web/.next

      - name: Package desktop (Electron packaging smoke)
        if: ${{ matrix.target == 'desktop' }}
        run: |
          bun run --cwd apps/desktop package
          node scripts/check-production-bundle.mjs apps/desktop/dist

      - name: Build cli
        if: ${{ matrix.target == 'cli' }}
        run: |
          bun run --cwd apps/cli build
          node scripts/analyze-bundles.mjs apps/cli/dist
          node scripts/check-production-bundle.mjs apps/cli/dist

  # FE1-I1 (#30) phase A4: the StillFlow capability matrix must stay in
  # mechanical sync with the authoritative route manifest
  # (stillflow backend/crates/stillflow-api/src/manifest.rs — OpenAPI is
  # derived from it, never the reverse). Pre-install by design: the check is
  # pure lexical/file consistency. Runbook: docs/ci/quality-gates.md
  # §Integration matrix.
  integration-matrix:
    name: Integration matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify the capability matrix against the manifest snapshot
        run: node scripts/check-capability-matrix.mjs

  # Rollback and restore against a REAL Docker daemon. This is the only job that
  # proves those paths work at all; every other test in the repo mocks the runtime.
  #
  # MANUAL by design: runs only on a manual `workflow_dispatch` and on release
  # tag pushes (v*) — never on main pushes or PRs, which stay fast (typecheck +
  # tests). The tag run is the release-restorability gate.
  #
  # `RUN_DOCKER_E2E=1` is what makes it honest: without it the suite skips when no
  # daemon answers, which is exactly how these cases sat green-and-unrun for months.
  # With it, an unreachable daemon fails in `beforeAll` instead of reporting skipped.
  #
  # `fast` is every daemon-level and full-cycle case (~5 min); `heavy` is
  # rollback-build-restore alone (~225s cold, and fileParallelism is off, so it
  # holds the whole suite up). Both run here — see E2E_SCOPE in
  # apps/api/vitest.e2e.config.ts.
  e2e-docker:
    name: E2E (real Docker, ${{ matrix.scope }})
    # Manual + release tags only. Never on main pushes or PRs.
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scope: [fast, heavy]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fail here rather than inside vitest, so "the runner lost Docker" is
      # distinguishable at a glance from "a rollback assertion broke".
      - name: Check the Docker daemon
        run: |
          docker info
          docker version

      - name: Run real-daemon E2E
        env:
          RUN_DOCKER_E2E: "1"
          E2E_SCOPE: ${{ matrix.scope }}
        run: bun run --cwd apps/api test:e2e
